[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-abr-ladder"
version = "0.1.0"
description = "Per-title / per-shot adaptive bitrate ladder generation, contract-verified"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Daniel Ramirez" }]
dependencies = []

[project.scripts]
smart-abr-ladder = "smart_abr_ladder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
